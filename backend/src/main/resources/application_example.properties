spring.application.name=library-manager
debug=true

# Database connection
spring.datasource.url=jdbc:mysql://localhost:3306/library_manager
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Database manager
# create        Borra y crea las tablas cada vez que arrancas (pierdes los datos)
# create-drop   Igual, y además borra todo al parar la app (útil para tests)
# update        Crea lo que falta y añade columnas nuevas, sin borrar datos existentes
# validate      No toca el esquema, solo valida que coincida (para producción, con Flyway)
# none          No hace nada
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true