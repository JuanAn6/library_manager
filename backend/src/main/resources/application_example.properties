spring.application.name=library-manager
debug=true

# Database connection
spring.datasource.url=jdbc:mysql://localhost:3306/library_manager
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Database manager
# create        Borra y crea las tablas cada vez que arrancas (pierdes los datos)
# create-drop   Igual, y además borra todo al parar la app (útil para tests)
# update        Crea lo que falta y añade columnas nuevas, sin borrar datos existentes
# validate      No toca el esquema, solo valida que coincida (para producción, con Flyway)
# none          No hace nada
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- Authentication ---
# Clave HMAC que firma los JWT (minimo 32 bytes). NO la subas al repositorio.
app.jwt.secret=${APP_JWT_SECRET:dev-only-secret-please-change-me-32b!}
app.jwt.ttl=PT30M
# true en cuanto sirvas la app por HTTPS
app.auth.cookie.secure=${APP_COOKIE_SECURE:false}
app.cors.allowed-origin=${APP_CORS_ORIGIN:http://localhost:4200}
app.seed.admin.username=admin
app.seed.admin.password=admin1234