<section class="book-form">
  <!-- Same three-state pattern as the list: loading / error / content.
       When creating there is no book to fetch, but the dropdowns still are, so
       loading() covers that wait too. -->
  @if (loading()) {
    <p>Loading book…</p>
  } @else if (isNew() || book()) {
    <h2>
      @if (isNew()) {
        New book
      } @else {
        Edit: {{ book()?.title }}
      }
    </h2>

    <!-- [formGroup] connects this <form> to the "form" property of the class.
         (ngSubmit) fires on submit (button click or Enter). We use it instead
         of (click) so keyboard users get the same behaviour. -->
    <form [formGroup]="form" (ngSubmit)="save()" class="main-form">
      <!-- formControlName="title" links this input to the control named
           "title". Two-way from then on: typing updates the control,
           patchValue updates the input. -->
      <label>
        <span>Title</span>
        <input type="text" formControlName="title" />
        <!-- Errors are shown only once the user touched the field, so a
             pristine form does not open covered in red. -->
        @if (form.controls.title.touched && form.controls.title.invalid) {
          <small class="field-error">Title is required.</small>
        }
      </label>

      <label>
        <span>ISBN</span>
        <input type="text" formControlName="isbn" />
      </label>

      <label>
        <span>Published date</span>
        <!-- type="date" expects the exact "YYYY-MM-DD" format the API sends,
             so the value maps across with no conversion. -->
        <input type="date" formControlName="publishedDate" />
      </label>

      <label>
        <span>Language</span>
        <input type="text" formControlName="language" />
      </label>

      <label>
        <span>Pages</span>
        <input type="number" min="0" formControlName="pageCount" />
      </label>

      <label>
        <span>Location</span>
        <input type="text" formControlName="location" />
      </label>

      <label>
        <span>Total copies</span>
        <input type="number" min="0" formControlName="totalCopies" />
      </label>

      <!-- Available copies are not editable: lending and returning are what
           move that number. A new book simply starts with all of them free. -->
      <label>
        <span>Available copies</span>
        @if (book(); as b) {
          <span>{{ b.availableCopies }}</span>
        } @else {
          <span class="hint">All copies, until the first one is lent.</span>
        }
      </label>

      <label class="full">
        <span>Description</span>
        <textarea rows="5" formControlName="description"></textarea>
      </label>

      <!-- Authors is a relation to another entity, so the dropdown is fed by
           /api/authors. "multiple" because a book can have several authors;
           [ngValue] keeps the option value a real number instead of text. -->
      <label class="full">
        <span>Authors</span>
        <select multiple size="6" formControlName="authorIds">
          @for (author of authors(); track author.id) {
            <option [ngValue]="author.id">{{ authorName(author) }}</option>
          }
        </select>
        <small class="hint">Hold Ctrl (Cmd on Mac) to select more than one.</small>
        <small class="selected">
          Selected:
          @if (selectedAuthors().length) {
            {{ selectedAuthors().length }} — {{ selectedAuthorNames() }}
          } @else {
            none
          }
        </small>
      </label>

      <!-- Category and publisher are relations too, but a book has at most one
           of each, so these are single-choice dropdowns. Both are optional in
           the model, hence the empty "—" option bound to null. -->
      <label>
        <span>Category</span>
        <select formControlName="categoryId">
          <option [ngValue]="null">—</option>
          @for (category of categories(); track category.id) {
            <option [ngValue]="category.id">{{ category.name }}</option>
          }
        </select>
      </label>

      <label>
        <span>Publisher</span>
        <select formControlName="publisherId">
          <option [ngValue]="null">—</option>
          @for (publisher of publishers(); track publisher.id) {
            <option [ngValue]="publisher.id">{{ publisher.name }}</option>
          }
        </select>
      </label>

      @if (error()) {
        <p class="error full">{{ error() }}</p>
      }

      <div class="actions full">
        <button type="submit" [disabled]="saving()">
          {{ saving() ? 'Saving…' : 'Save' }}
        </button>
        <a [routerLink]="cancelLink()">Cancel</a>
      </div>
    </form>
  } @else if (error()) {
    <p class="error">{{ error() }}</p>
  }

  <p><a routerLink="/books">← Back to the list</a></p>
</section>
