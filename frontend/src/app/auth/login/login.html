<section class="auth">
  <h2>Sign in</h2>

  <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
    <label>
      <span>Username or email</span>
      <!-- type="text", not type="email": either one is accepted here, and the
           email keyboard validation would reject a plain username. -->
      <input type="text" formControlName="identifier" autocomplete="username" />
      @if (form.controls.identifier.touched && form.controls.identifier.invalid) {
        <small class="field-error">Your username or email is required.</small>
      }
    </label>

    <label>
      <span>Password</span>
      <input type="password" formControlName="password" autocomplete="current-password" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <small class="field-error">Password is required.</small>
      }
    </label>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <button type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>

  <p class="switch">
    No account yet? <a routerLink="/register">Create one</a>
  </p>
</section>
